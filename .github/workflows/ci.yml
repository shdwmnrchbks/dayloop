name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, steamdeck]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for self-hosted runner
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841 # v6.0
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Validate content packs (packlint)
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"
