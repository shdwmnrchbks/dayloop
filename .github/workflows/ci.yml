name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Dayloop's toolchain is provisioned by the workflow and supports both of
    # the org's current x64 self-hosted pools (Windows and Linux). GitHub can
    # therefore dispatch to whichever compatible x64 runner is available.
    runs-on: [self-hosted, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK for self-hosted runner
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841 # v6.0
        with:
          sdk-version: '35'
          build-tools-version: '35.0.0'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew assembleDebug :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\gradlew.bat assembleDebug :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Validate content packs (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"

      - name: Validate content packs (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\gradlew.bat packlint
          .\gradlew.bat packlint "-Ppack=content/packs/p3r"
          .\gradlew.bat packlint "-Ppack=content/packs/metaphor"
